[tool:pytest]
# Pytest Configuration for Expresso Churn Prediction ML System
# Educational Focus: Comprehensive testing setup for ML projects

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add src to Python path
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --durations=10

# Test markers for categorization
markers =
    unit: Unit tests that test individual functions/classes
    integration: Integration tests that test component interactions
    contract: Contract tests that verify interface compliance
    performance: Performance and benchmark tests
    slow: Tests that take a long time to run
    ml: Machine learning specific tests
    data: Data processing and validation tests
    business: Business logic and ROI calculation tests

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    # Specific to ML libraries
    ignore::sklearn.exceptions.ConvergenceWarning
    ignore::pandas.errors.PerformanceWarning

# Test environment variables
env =
    PYTHONPATH = src
    TESTING = true
    LOG_LEVEL = DEBUG

# Parallel testing configuration (optional)
# Uncomment if pytest-xdist is installed
# addopts = -n auto

# Coverage configuration (works with pytest-cov)
[coverage:run]
source = src
omit =
    */tests/*
    */test_*
    setup.py
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    @abstractmethod